<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NEONSHOT Anatomy</title>
  <meta name="description" content="A first-person, synthwave FPS aim trainer. Pointer-lock aiming, raycast shooting, persistent personal bests. Runs entirely in your browser." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js is vendored locally (no external CDN at runtime → fully
       self-contained and deployable anywhere). The import map lets app code
       use the clean `import * as THREE from 'three'` specifier. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- CRT atmosphere -->
  <div id="scanlines" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- Fixed first-person crosshair -->
  <div id="crosshair" aria-hidden="true">
    <span class="ch-line ch-up"></span>
    <span class="ch-line ch-down"></span>
    <span class="ch-line ch-left"></span>
    <span class="ch-line ch-right"></span>
    <span class="ch-dot"></span>
  </div>

  <div id="hitmarker" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div id="miss-flash" aria-hidden="true"></div>
  <div id="combo-flash" aria-hidden="true"></div>

  <!-- Anatomy scenarios: which landmark to shoot + shot feedback -->
  <div id="prompt" class="hide">
    <span class="prompt-label">Hit the</span>
    <span class="prompt-name" id="prompt-name"></span>
    <span class="prompt-ko" id="prompt-ko"></span>
    <div class="prompt-bar"><span id="prompt-bar-fill"></span></div>
    <span class="prompt-note" id="prompt-note"></span>
  </div>

  <!-- In-game HUD (bottom dock) -->
  <div id="hud" class="hide">
    <div class="stat"><span class="stat-label">Score</span><span class="stat-val" id="score-val">0</span></div>
    <div class="stat"><span class="stat-label">Accuracy</span><span class="stat-val" id="acc-val">—</span></div>
    <div class="stat"><span class="stat-label">Streak</span><span class="stat-val" id="streak-val">0</span></div>
    <div class="stat"><span class="stat-label">Avg ms</span><span class="stat-val" id="react-val">—</span></div>
    <div class="stat stat--time"><span class="stat-label">Time</span><span class="stat-val" id="timer-val">30</span></div>
  </div>

  <div id="pause-hint" class="hide">Click to resume — move to aim · click to fire · <kbd>Esc</kbd> to pause</div>

  <!-- Touch controls (shown only on coarse-pointer devices during a round) -->
  <button id="fire-btn" class="hide" aria-label="Fire">FIRE</button>
  <button id="quit-btn" class="hide" aria-label="Quit round">EXIT</button>

  <!-- Main menu / results overlay -->
  <div id="overlay">
    <div class="panel">
      <header class="brand">
        <h1 class="logo" data-text="NEONSHOT">NEONSHOT</h1>
        <p class="tagline" id="overlay-sub">First-person aim trainer</p>
      </header>

      <div id="results-area"></div>

      <div class="config">
        <div class="field">
          <label class="field-label">Scenario</label>
          <div class="seg" id="scenario"></div>
          <p class="field-hint" id="scenario-blurb"></p>
        </div>

        <div class="field">
          <label class="field-label">Difficulty</label>
          <div class="seg" id="difficulty"></div>
        </div>

        <div class="field">
          <label class="field-label">Sensitivity <span class="mono" id="sens-readout">1.00</span></label>
          <input id="sens-slider" type="range" min="0.2" max="3" step="0.05" value="1" />
        </div>

        <div id="best-badge" class="best-badge hide">
          <span class="best-badge-label">Personal best</span>
          <span class="best-badge-val" id="best-score">—</span>
        </div>
      </div>

      <button id="start-btn" class="btn btn--primary">Enter the Grid</button>

      <div class="footer-row">
        <button id="stats-btn" class="btn btn--ghost">Stats &amp; Records</button>
        <span class="hint">Pointer-lock prompt appears on start.</span>
      </div>
    </div>
  </div>

  <!-- Stats modal -->
  <div id="stats-modal" class="modal hide">
    <div class="modal-card">
      <header class="modal-head">
        <h2>Stats &amp; Records</h2>
        <button id="stats-close" class="icon-btn" aria-label="Close">✕</button>
      </header>
      <div id="stats-body"></div>
      <footer class="modal-foot">
        <button id="stats-reset" class="btn btn--ghost btn--danger">Reset all data</button>
      </footer>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
